<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famous Locations</title>
    <link rel="stylesheet" href="../src/css/output.css">
</head>
<body class="bg-gray-50">
    <header-nav title="Cultural Thailand"></header-nav>

    <section class="max-w-6xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold mb-10 text-center">Famous Locations in Thailand</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

            <location-card 
                title="Ayutthaya"
                desc="The ancient capital of Thailand filled with historical temples and ruins."
                link="./locations/Ayutthaya.html"
                image="http://virtualhistoricalpark.finearts.go.th/ayutthaya/images/img_head_eng.jpg"
            >
            </location-card>

            <location-card 
                title="Chiang Mai Museum"
                desc="Explore the cultural and historical heritage of Northern Thailand."
                link="./locations/ChiangMaiMuseum.html"
                image="https://cmocity.com/wp-content/uploads/2019/11/wp3-1.jpg"
            >
            </location-card>

            <location-card 
                title="Floating Market"
                desc="A lively market on water offering local food and traditional goods."
                link="./locations/FloatingMarket.html"
                image="https://www.asiakingtravel.com/images/thumbs/2023/11/7255/banner_1900x700xcrop.webp"
            >
            </location-card>

            <location-card 
                title="Grand Palace"
                desc="Thailand’s most luxurious royal palace, known for its stunning architecture."
                link="./locations/GrandPalace.html"
                image="https://cdn.royalgrandpalace.th/images/history/sec1_dt.jpg"
            >
            </location-card>

            <location-card 
                title="Sanctuary of Truth"
                desc="A breathtaking all-wood temple filled with detailed wooden carvings."
                link="./locations/SanctuaryofTruth.html"
                image="https://pattayacitytourcoltd.com/uploads/SightSeenImage/the-sanctuary-of-truth-6332.jpg"
            >
            </location-card>

            <location-card 
                title="Si Thep"
                desc="An ancient UNESCO World Heritage site representing early Thai civilization."
                link="./locations/SiThep.html"
                image="https://www.bangkokbigears.com/wp-content/uploads/2023/10/SI-THEP-RUIN-05.webp"
            >
            </location-card>

            <location-card 
                title="Sukhothai"
                desc="The birthplace of Thai culture with beautifully preserved ruins."
                link="./locations/Sukhothai.html"
                image="http://virtualhistoricalpark.finearts.go.th/sukhothai/images/img_head_eng.jpg"
            >
            </location-card>

            <location-card 
                title="Wat Arun"
                desc="The famous Temple of Dawn located by the Chao Phraya River."
                link="./locations/WatArun.html"
                image="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/30/d9/a5/f7/caption.jpg?w=800&h=800&s=1"
            >
            </location-card>

            <location-card 
                title="Wat Phra"
                desc="A sacred temple known for its historical and religious significance."
                link="./locations/WatPhra.html"
                image="https://www.watpho.com/public/images/contact/contact_history_408-12-2018%2019_22_34.jpg"
            >
            </location-card>

            <location-card 
                title="Wat Rong Khun"
                desc="The iconic White Temple, famous for its unique artistic design."
                link="./locations/WatRongKhun.html"
                image="https://shippedaway.com/wp-content/uploads/2024/02/White-Temple-Chiang-Rai-Thailand-21.jpg"
            >
            </location-card>

        </div>
    </section>

    <footer-section></footer-section>
    <script type="module" src="../src/js/app.js"></script>
</body>
</html>
